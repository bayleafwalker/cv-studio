name: Publish container image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cv-studio:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/cv-studio:sha-${{ github.sha }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cv-studio
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - run: |
          echo "ghcr.io/${{ github.repository_owner }}/cv-studio@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
